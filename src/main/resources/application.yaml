spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${NEON_HOST}/${NEON_DB}?sslmode=require
    username: ${NEON_USER}
    password: ${NEON_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

trc:
  url: ${TRC_URL}
  email: ${TRC_EMAIL}
  password: ${TRC_PASSWORD}

cfobras:
  url: ${CFOBRAS_URL}
  email: ${CFOBRAS_EMAIL}
  password: ${CFOBRAS_PASSWORD}